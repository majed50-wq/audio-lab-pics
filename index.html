<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#05071a" />
<title>Neon Galaxy Armada</title>
<style>
:root{--bg:#05071a;--panel:rgba(10,16,42,.82);--cyan:#39f5ff;--pink:#ff3df2;--gold:#ffd86b;--green:#5dff9a;--red:#ff5b73;--text:#eaf7ff;--muted:#8ea8c7}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 20%,#16255c 0%,#05071a 55%,#02030a 100%);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color:var(--text);touch-action:none;user-select:none}button,select{font:inherit}#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}.game-shell{position:relative;width:min(100vw,520px);height:100vh;max-height:960px;overflow:hidden;background:#030614;box-shadow:0 0 60px rgba(57,245,255,.22)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.screen{position:absolute;inset:0;z-index:10;display:none;padding:18px;background:linear-gradient(180deg,rgba(3,6,20,.72),rgba(3,6,20,.94));backdrop-filter:blur(6px);overflow:auto}.screen.active{display:block}.center{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}.title{font-size:clamp(34px,10vw,58px);line-height:.92;margin:0;text-transform:uppercase;letter-spacing:2px;text-shadow:0 0 12px var(--cyan),0 0 28px var(--pink)}.subtitle{color:var(--muted);margin:0 0 8px}.panel{width:100%;border:1px solid rgba(57,245,255,.32);border-radius:20px;background:var(--panel);box-shadow:inset 0 0 24px rgba(57,245,255,.08),0 14px 40px rgba(0,0,0,.35);padding:14px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.btn{border:1px solid rgba(57,245,255,.45);color:var(--text);background:linear-gradient(135deg,rgba(57,245,255,.18),rgba(255,61,242,.14));border-radius:14px;padding:12px 14px;font-weight:800;letter-spacing:.3px;box-shadow:0 0 18px rgba(57,245,255,.16);cursor:pointer}.btn:active{transform:translateY(1px) scale(.99)}.btn.primary{background:linear-gradient(135deg,#1eeeff,#9b35ff 55%,#ff3df2);color:#02030a;border:0}.btn.warn{border-color:rgba(255,91,115,.6);background:rgba(255,91,115,.14)}.small{font-size:12px;color:var(--muted)}.topbar{position:absolute;top:0;left:0;right:0;z-index:8;padding:8px 10px;display:none;gap:7px;align-items:flex-start;pointer-events:none}.hud-card{background:rgba(3,6,20,.64);border:1px solid rgba(57,245,255,.23);border-radius:12px;padding:6px 8px;min-width:64px;box-shadow:0 0 18px rgba(0,0,0,.3)}.bar{height:8px;width:92px;background:rgba(255,255,255,.13);border-radius:99px;overflow:hidden;margin-top:4px}.fill{height:100%;width:100%;background:linear-gradient(90deg,var(--green),var(--cyan));box-shadow:0 0 12px currentColor}.fill.hp{background:linear-gradient(90deg,#ff476d,#ffd36a)}.fill.shield{background:linear-gradient(90deg,#3df5ff,#406bff)}#bossBar{position:absolute;left:20px;right:20px;top:64px;z-index:8;display:none}.ship-card,.upgrade-card,.mission-card{border:1px solid rgba(255,255,255,.13);border-radius:16px;background:rgba(255,255,255,.055);padding:10px;text-align:left}.ship-art{height:56px;display:flex;align-items:center;justify-content:center;font-size:34px;filter:drop-shadow(0 0 10px var(--cyan))}.locked{opacity:.52;filter:grayscale(.6)}.tabs{display:flex;gap:8px;position:sticky;top:0;background:rgba(3,6,20,.88);padding:4px 0 10px;z-index:2}.tab{flex:1;padding:9px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:var(--text)}.tab.active{border-color:var(--cyan);box-shadow:0 0 16px rgba(57,245,255,.2)}#touchControls{position:absolute;inset:auto 0 0 0;height:38%;z-index:7;display:none;pointer-events:none}.stick{position:absolute;left:18px;bottom:26px;width:118px;height:118px;border-radius:50%;border:1px solid rgba(57,245,255,.35);background:rgba(57,245,255,.06);pointer-events:auto}.knob{position:absolute;left:39px;top:39px;width:40px;height:40px;border-radius:50%;background:rgba(57,245,255,.65);box-shadow:0 0 22px var(--cyan)}.fire{position:absolute;right:22px;bottom:34px;width:96px;height:96px;border-radius:50%;border:0;background:radial-gradient(circle,#fff,#ffdd66 34%,#ff3d70);color:#17030a;font-weight:900;box-shadow:0 0 30px rgba(255,61,112,.6);pointer-events:auto}.pill{display:inline-flex;gap:5px;align-items:center;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 9px;background:rgba(255,255,255,.07);font-size:12px}.rarity-Common{color:#cfe2ff}.rarity-Rare{color:#57b9ff}.rarity-Epic{color:#ca72ff}.rarity-Legendary{color:#ffd45b}@media (min-width:700px){.game-shell{border-radius:24px;height:min(100vh,920px);margin:10px}.screen{padding:22px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media (hover:none){#touchControls{display:block}}
</style>
</head>
<body>
<div id="app"><div class="game-shell">
<canvas id="game"></canvas>
<div class="topbar" id="hud"><div class="hud-card">HP<div class="bar"><div id="hpFill" class="fill hp"></div></div></div><div class="hud-card">SH<div class="bar"><div id="shieldFill" class="fill shield"></div></div></div><div class="hud-card">💰 <span id="hudCoins">0</span><br><span class="small">Lv <b id="hudLevel">1</b></span></div><div class="hud-card">⭐ <span id="hudScore">0</span><br><span class="small" id="hudWeapon">Single</span></div><button class="btn" style="pointer-events:auto;margin-left:auto;padding:8px 10px" onclick="Game.pause()">Ⅱ</button></div>
<div id="bossBar"><div class="small row"><b id="bossName">BOSS</b><span id="bossHpText"></span></div><div class="bar" style="width:100%;height:12px"><div id="bossFill" class="fill hp"></div></div></div>
<div id="touchControls"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><button class="fire" id="fireBtn">FIRE</button></div>
<section id="menu" class="screen active"><div class="center"><h1 class="title">Neon<br>Galaxy<br>Armada</h1><p class="subtitle">Arcade bullet-hell space shooter</p><div class="panel"><div class="row"><span>💰 <b data-coins>0</b></span><span>🏆 <b id="highScore">0</b></span><span>🌎 World <b id="worldTxt">1</b></span></div></div><button class="btn primary" onclick="Game.start('campaign')">PLAY CAMPAIGN</button><div class="grid" style="width:100%"><button class="btn" onclick="UI.show('ships')">Ships</button><button class="btn" onclick="UI.show('upgrades')">Upgrades</button><button class="btn" onclick="Game.start('endless')">Endless</button><button class="btn" onclick="Game.start('survival')">Survival</button><button class="btn" onclick="UI.show('missions')">Missions</button><button class="btn" onclick="UI.show('stats')">Stats</button><button class="btn" onclick="UI.show('settings')">Settings</button><button class="btn" onclick="Save.daily()">Daily Reward</button></div></div></section>
<section id="ships" class="screen"><div class="tabs"><button class="tab active">Ship Hangar</button><button class="tab" onclick="UI.show('menu')">Back</button></div><div id="shipGrid" class="grid"></div></section>
<section id="upgrades" class="screen"><div class="tabs"><button class="tab active">Upgrades</button><button class="tab" onclick="UI.show('menu')">Back</button></div><p class="row panel">Coins <b data-coins>0</b></p><div id="upgradeList" class="grid"></div></section>
<section id="missions" class="screen"><div class="tabs"><button class="tab active">Missions</button><button class="tab" onclick="UI.show('menu')">Back</button></div><div id="missionList" class="panel"></div></section>
<section id="stats" class="screen"><div class="tabs"><button class="tab active">Statistics</button><button class="tab" onclick="UI.show('menu')">Back</button></div><div id="statsBox" class="panel"></div><h3>Achievements</h3><div id="achievements" class="grid"></div></section>
<section id="settings" class="screen"><div class="tabs"><button class="tab active">Settings</button><button class="tab" onclick="UI.show('menu')">Back</button></div><div class="panel"><label class="row">Sound <input id="soundToggle" type="checkbox" checked></label><label class="row">Screen Shake <input id="shakeToggle" type="checkbox" checked></label><label class="row">Difficulty <select id="difficulty"><option>Normal</option><option>Hard</option><option>Nightmare</option></select></label><button class="btn warn" onclick="Save.reset()">Reset Save</button></div></section>
<section id="pause" class="screen"><div class="center"><h2>Paused</h2><button class="btn primary" onclick="Game.resume()">Resume</button><button class="btn" onclick="Game.quit()">Quit</button></div></section>
<section id="gameover" class="screen"><div class="center"><h2 id="endTitle">Game Over</h2><div class="panel" id="endStats"></div><button class="btn primary" onclick="Game.start(Game.mode)">Retry</button><button class="btn" onclick="Game.quit()">Main Menu</button></div></section>
</div></div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const SHIPS=['Falcon','Viper','Nova','Orion','Comet','Phoenix','Specter','Titan','Eclipse','Astra'].map((n,i)=>({name:n,icon:['🚀','🛸','✦','◆','▲','♢','⬟','⬢','✧','★'][i],cost:i?300+i*i*220:0,damage:1+i*.18,fire:1+i*.07,hp:100+i*14,speed:5+i*.18,rarity:['Common','Common','Rare','Rare','Epic','Epic','Epic','Legendary','Legendary','Legendary'][i]}));

const Save={data:null,load(){this.data=JSON.parse(localStorage.neonArmada||'null')||{coins:350,ships:['Falcon'],ship:'Falcon',upgrades:{},high:0,level:1,world:1,stats:{kills:0,runs:0,bosses:0,coins:0},ach:{},lastDaily:0};UPGRADES.forEach(u=>this.data.upgrades[u.key]??=0);},write(){localStorage.neonArmada=JSON.stringify(this.data);UI.refresh();},daily(){let d=new Date().toDateString();if(this.data.lastDaily===d)return alert('Daily reward already claimed.');this.data.lastDaily=d;this.data.coins+=500;AudioFX.upgrade();this.write();alert('Daily reward: 500 coins!');},reset(){if(confirm('Reset all progress?')){localStorage.removeItem('neonArmada');this.load();UI.build();}}};
const AudioFX={ctx:null,on:true,beep(f=440,t=.06,type='sine',g=.04){if(!this.on)return;this.ctx??=new (window.AudioContext||window.webkitAudioContext)();let o=this.ctx.createOscillator(),v=this.ctx.createGain();o.type=type;o.frequency.value=f;v.gain.value=g;o.connect(v);v.connect(this.ctx.destination);o.start();v.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+t);o.stop(this.ctx.currentTime+t);},shoot(){this.beep(760,.035,'square',.025)},boom(){this.beep(90,.18,'sawtooth',.07)},warn(){this.beep(180,.35,'triangle',.08)},upgrade(){this.beep(960,.08,'sine',.05);setTimeout(()=>this.beep(1280,.08,'sine',.05),80)}};
class Pool{constructor(make){this.make=make;this.items=[]}get(){return this.items.pop()||this.make()}free(o){o.active=false;this.items.push(o)}}
const Game={canvas:null,ctx:null,w:0,h:0,dpr:1,state:'menu',mode:'campaign',t:0,last:0,shake:0,keys:{},pointer:{x:0,y:0,down:false},pools:{},init(){this.canvas=$('#game');this.ctx=this.canvas.getContext('2d');addEventListener('resize',()=>this.resize());this.resize();this.bind();this.pools={bullet:new Pool(()=>({})),enemy:new Pool(()=>({})),ebullet:new Pool(()=>({})),particle:new Pool(()=>({})),power:new Pool(()=>({}))};this.loop(0)},resize(){this.dpr=Math.min(devicePixelRatio||1,2);let r=this.canvas.getBoundingClientRect();this.w=r.width;this.h=r.height;this.canvas.width=this.w*this.dpr;this.canvas.height=this.h*this.dpr;this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0)},bind(){addEventListener('keydown',e=>{this.keys[e.key]=true;if(e.key==='Escape')this.pause()});addEventListener('keyup',e=>this.keys[e.key]=false);this.canvas.addEventListener('pointermove',e=>{let r=this.canvas.getBoundingClientRect();this.pointer.x=e.clientX-r.left;this.pointer.y=e.clientY-r.top;if(this.pointer.down&&this.player){this.player.x=this.pointer.x;this.player.y=this.pointer.y}});this.canvas.addEventListener('pointerdown',e=>{this.pointer.down=true;this.canvas.setPointerCapture(e.pointerId)});this.canvas.addEventListener('pointerup',()=>this.pointer.down=false);$('#fireBtn').onpointerdown=()=>this.keys[' ']=true;$('#fireBtn').onpointerup=()=>this.keys[' ']=false;let stick=$('#stick'),knob=$('#knob');stick.onpointermove=e=>{let r=stick.getBoundingClientRect(),x=e.clientX-r.left-59,y=e.clientY-r.top-59,d=Math.hypot(x,y)||1,m=Math.min(d,42);knob.style.left=39+x/d*m+'px';knob.style.top=39+y/d*m+'px';this.joy={x:x/42,y:y/42}};stick.onpointerup=()=>{this.joy={x:0,y:0};knob.style.left=knob.style.top='39px'}},start(mode){this.mode=mode;UI.hide();$('#hud').style.display='flex';$('#touchControls').style.display='block';let s=SHIPS.find(x=>x.name===Save.data.ship),u=Save.data.upgrades;this.player={x:this.w/2,y:this.h-110,r:18,hp:s.hp+u.hp*15,maxHp:s.hp+u.hp*15,shield:35+u.shield*10,maxShield:35+u.shield*10,damage:s.damage+u.damage*.25,fire:210/(s.fire+u.fire_rate*.12),speed:s.speed+u.speed*.22,crit:.05+u.critical*.025,weapon:0,inv:0,combo:0,exp:0};Object.assign(this,{state:'play',score:0,coins:0,level:mode==='campaign'?Save.data.level:1,world:Save.data.world,bullets:[],enemies:[],ebullets:[],particles:[],powers:[],boss:null,spawn:0,fireCd:0,wave:0,stars:Array.from({length:120},()=>({x:Math.random()*this.w,y:Math.random()*this.h,z:rand(.4,2.4)}))});Save.data.stats.runs++;AudioFX.warn()},pause(){if(this.state==='play'){this.state='pause';UI.show('pause')}},resume(){UI.hide();this.state='play'},quit(){this.state='menu';$('#hud').style.display='none';$('#bossBar').style.display='none';$('#touchControls').style.display='none';UI.show('menu');Save.write()},loop(ts){let dt=Math.min((ts-this.last)/16.666,2)||1;this.last=ts;if(this.state==='play')this.update(dt);this.draw(dt);requestAnimationFrame(t=>this.loop(t))},update(dt){this.t+=dt;let p=this.player;if(this.keys.ArrowLeft||this.keys.a)p.x-=p.speed*dt;if(this.keys.ArrowRight||this.keys.d)p.x+=p.speed*dt;if(this.keys.ArrowUp||this.keys.w)p.y-=p.speed*dt;if(this.keys.ArrowDown||this.keys.s)p.y+=p.speed*dt;if(this.joy){p.x+=this.joy.x*p.speed*1.4*dt;p.y+=this.joy.y*p.speed*1.4*dt}p.x=clamp(p.x,20,this.w-20);p.y=clamp(p.y,60,this.h-30);p.inv=Math.max(0,p.inv-dt);this.fireCd-=16.66*dt;if((this.keys[' ']||this.pointer.down||innerWidth<700)&&this.fireCd<=0)this.shoot();this.spawn-=dt;if(!this.boss&&this.spawn<=0)this.spawnWave();[...this.bullets,...this.ebullets,...this.enemies,...this.particles,...this.powers].forEach(o=>{if(o.active!==false){o.x+=(o.vx||0)*dt;o.y+=(o.vy||0)*dt;o.life=(o.life??999)-dt;if(o.ai)o.ai(o,dt)}});this.collide();this.cleanup();if(this.level%5===0&&!this.boss&&this.wave>3)this.spawnBoss();this.updateHud()},shoot(){let p=this.player,w=WEAPONS[p.weapon];this.fireCd=p.fire*(p.rapid?0.45:1);AudioFX.shoot();let angles=w==='Spread'?[-.32,-.16,0,.16,.32]:w==='Triple'?[-.13,0,.13]:w==='Double'?[-.07,.07
